title: Remote Code Execution Payload In Web Input
id: 3b510984-11a2-5728-a4d7-1a59210d5ee9
status: experimental
description: >
  A request parameter carrying shell metacharacters chained with a interpreter call, the command-injection shape tested by chiper-command-injection-advanced.
references:
  - https://owasp.org/www-community/attacks/Command_Injection
author: chiper-cyber
date: 2026-11-24
tags:
