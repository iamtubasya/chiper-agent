title: MCP Server Path Traversal Attempt
id: 228115f2-0e23-5cac-9943-010b5e65c960
status: experimental
description: >
  A Model Context Protocol tool call whose path argument escapes the server root, matching the tool poisoning and traversal tests in chiper-ai-agent-security.
references:
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
author: chiper-cyber
date: 2026-11-24
tags:
  - attack.initial-access
  - attack.t1190
logsource:
  category: ai_mcp
  product: any
detection:
  selection:
    event.type: mcp.tool.call
    tool.args.path|contains|all: ['..', '/etc']
  condition: selection
falsepositives:
  - Benign tools that legitimately walk parent directories
level: high
