title: Prompt Injection Content In Model Input
id: bd5601a0-fda7-5b51-a46e-44a1efc7bbef
status: experimental
description: >
  User or retrieved content carrying direct prompt-injection directives, shared by chiper-ai-security and chiper-ai-safety-redteam-advanced.
references:
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
author: chiper-cyber
date: 2026-11-24
tags:
  - attack.initial-access
  - attack.t1059
logsource:
  category: ai_input
  product: any
detection:
  selection:
    input.text|contains|all: ['ignore previous instructions', 'system prompt']
  condition: selection
falsepositives:
  - Security training material quoting the phrase
level: high
