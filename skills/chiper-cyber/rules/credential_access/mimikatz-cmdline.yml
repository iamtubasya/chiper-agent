title: Mimikatz Command Line Indicators
id: 42ef3e21-1628-5453-b64a-a2dea2989c80
status: experimental
description: >
  Command lines carrying classic Mimikatz invocation markers such as sekurlsa:: or privilege::debug.
references:
  - https://attack.mitre.org/
author: chiper-cyber
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all: ['sekurlsa::', 'privilege::debug']
  condition: selection
falsepositives:
  - Red-team exercise with the tool staged by name
level: high
